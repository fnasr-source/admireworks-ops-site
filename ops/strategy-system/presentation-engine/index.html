<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ein Abayaa — Direct Response Marketing Strategy | Admireworks</title>
  <link rel="icon" href="./assets/screenshots/ein-favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader" class="loader">
    <div class="loader-inner">
      <img src="./assets/brand/brandmark.png" alt="Admireworks" class="loader-logo">
      <div class="loader-bar"><div class="loader-fill"></div></div>
      <p class="loader-text">Loading Strategy Presentation</p>
    </div>
  </div>

  <!-- Presentation Shell -->
  <div id="app" class="app">

    <!-- Top Bar -->
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <img src="./assets/brand/brandmark.png" alt="Admireworks" class="topbar-logo">
        <span class="topbar-divider"></span>
        <img src="./assets/screenshots/ein-abaya-logo-zid.png" alt="Ein Abayaa" class="topbar-logo topbar-logo--client">
      </div>
      <div class="topbar-center">
        <span id="slideCounter" class="topbar-counter">1 / 1</span>
      </div>
      <div class="topbar-right">
        <button id="btnPresenter" class="topbar-btn" title="Toggle Presenter Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </button>
        <button id="btnFullscreen" class="topbar-btn" title="Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
    </header>

    <!-- Slide Viewport + Presenter Sidebar -->
    <div id="viewport" class="viewport">
      <div id="slideContainer" class="slide-container"></div>
      <aside id="presenterSidebar" class="presenter-sidebar">
        <section class="presenter-region presenter-clock-region">
          <div class="presenter-label">ELAPSED</div>
          <div class="presenter-clock" id="presenterClock">00:00</div>
        </section>
        <section class="presenter-region presenter-next-region">
          <div class="presenter-label">NEXT SLIDE</div>
          <div class="presenter-next">
            <div class="presenter-next-number" id="presenterNextNumber">—</div>
            <div class="presenter-next-title" id="presenterNextTitle">End of presentation</div>
          </div>
        </section>
        <section class="presenter-region presenter-notes-region">
          <div class="presenter-label">PRESENTER NOTES</div>
          <div class="notes-content" id="notesContent"></div>
        </section>
      </aside>
    </div>

    <!-- Bottom Navigation -->
    <nav id="navbar" class="navbar">
      <button id="btnPrev" class="nav-btn" aria-label="Previous slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div id="progressTrack" class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <button id="btnNext" class="nav-btn" aria-label="Next slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </nav>

  </div>

  <!-- Firebase Web SDK (compat) — always loaded except in PDF export mode.
       engine-data.js decides per-request whether to use Firestore (live, auth-aware),
       the public slides API (anonymous share-link viewers), or static content.json. -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('pdf') === '1') return; // PDF export → static only, no SDK overhead
      var loaded = 0;
      function done() {
        loaded++;
        if (loaded === 2) {
          // Both auth + firestore compat scripts ready — signal engine-data.js
          window.__firebaseSdkReady = true;
          if (typeof window.__onFirebaseSdkReady === 'function') window.__onFirebaseSdkReady();
        }
      }
      var s1 = document.createElement('script');
      s1.src = 'https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js';
      s1.onload = function () {
        var sAuth = document.createElement('script');
        sAuth.src = 'https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js';
        sAuth.onload = done;
        sAuth.onerror = done;
        document.head.appendChild(sAuth);

        var sFs = document.createElement('script');
        sFs.src = 'https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js';
        sFs.onload = done;
        sFs.onerror = done;
        document.head.appendChild(sFs);
      };
      s1.onerror = function () { window.__firebaseSdkReady = false; };
      document.head.appendChild(s1);
    })();
  </script>
  <script src="engine-data.js"></script>
  <script src="engine-analytics.js"></script>
  <script src="engine-live-session.js"></script>
  <script src="app.js"></script>
</body>
</html>
